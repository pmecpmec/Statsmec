# Production site: only `main` is deployed. Do day-to-day work on `develop` (or feature branches),
# then merge to `main` when the public build should update.
name: Deploy Astro frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_DEV_UI: 'false'
          # Set the production backend base URL via a repo/Actions variable.
          # Configure it under Settings → Secrets and variables → Actions → Variables.
          # Must include the /api/v1 suffix (e.g. https://api.pmec.dev/api/v1).
          # Falls back to the default in code if the variable is unset.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          npm run build
          cp CNAME dist/CNAME || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

